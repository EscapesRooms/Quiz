<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normas del Juego</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="welcome-container">

    <h1 class="game-title">
        📋 NORMAS DEL JUEGO
    </h1>

    <div id="playerInfo"></div>

    <div class="rules-box">

        <p>⏱ Cada pregunta tendrá 30 segundos.</p>

        <p>✅ Cada acierto suma puntos para tu equipo.</p>

        <p>❌ No podrás cambiar tu respuesta.</p>

        <p>📊 Tras cada ronda se mostrarán las estadísticas.</p>

        <p>🏆 Gana el equipo con más puntos al finalizar.</p>

    </div>

    <button id="startGame" class="continue-btn">
        Comenzar partida
    </button>

</div>

<script>

const player =
localStorage.getItem("playerName");

const team =
localStorage.getItem("team");

document.getElementById("playerInfo").innerHTML = `
<h2>${player}</h2>
<h3>Equipo ${team}</h3>
`;

document
.getElementById("startGame")
.addEventListener("click",()=>{

    window.location.href=
    "question.html";

});

</script>

</body>
</html>
