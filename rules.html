<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Codificación de caracteres -->
    <meta charset="UTF-8">

    <!-- Adaptación a móviles -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Normas del Juego</title>

    <!-- Cargar hoja de estilos -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="welcome-container">

        <!-- Título principal -->
        <h1 class="game-title">
            📋 NORMAS DEL JUEGO
        </h1>

        <!-- Aquí mostraremos el nombre del jugador y el equipo -->
        <div id="playerInfo"></div>

        <!-- Caja de normas -->
        <div class="rules-box">

            <p>⏱ Cada pregunta tendrá 15 segundos.</p>

            <p>✅ Cada acierto suma 1 punto.</p>

            <p>❌ No podrás cambiar tu respuesta.</p>

            <p>📊 Se mostrará la respuesta correcta al finalizar.</p>

            <p>🏆 Consigue la máxima puntuación posible.</p>

        </div>

        <!-- Aquí mostraremos información de una partida guardada -->
        <div id="saveInfo"></div>

        <!-- Botón para empezar desde cero -->
        <button id="newGameBtn"
                class="continue-btn">

            🎮 Nueva partida

        </button>

        <!-- Botón para continuar una partida existente -->
        <button id="continueGameBtn"
                class="continue-btn"
                style="display:none;">

            ↩️ Continuar partida

        </button>

    </div>

    <script>

    /* ==========================================
       DATOS DEL JUGADOR
       ========================================== */

    // Recuperar nombre guardado
    const player =
    localStorage.getItem("playerName");

    // Recuperar equipo guardado
    const team =
    localStorage.getItem("team");

    // Mostrar jugador y equipo en pantalla
    document.getElementById("playerInfo").innerHTML = `

        <h2>${player}</h2>

        <h3>Equipo ${team}</h3>

    `;


    /* ==========================================
       DATOS DE LA PARTIDA
       ========================================== */

    // Recuperar pregunta actual
    const currentQuestion =
    parseInt(
        localStorage.getItem("currentQuestion")
    ) || 0;

    // Recuperar puntuación actual
    const score =
    parseInt(
        localStorage.getItem("score")
    ) || 0;

    // Referencia al botón continuar
    const continueBtn =
    document.getElementById(
        "continueGameBtn"
    );


    /* ==========================================
       DETECTAR PARTIDA GUARDADA
       ========================================== */

    // Si ya existe una partida empezada,
    // mostrar botón de continuar
    if(currentQuestion > 0){

        continueBtn.style.display =
        "inline-block";

        continueBtn.innerHTML =

        `↩️ Continuar partida
        <br>
        Pregunta ${currentQuestion + 1}
        <br>
        Puntos: ${score}`;

        // Mensaje informativo
        document.getElementById(
            "saveInfo"
        ).innerHTML =

        `<p style="
            margin-bottom:20px;
            color:#4ade80;
        ">
        💾 Partida guardada detectada
        </p>`;
    }


    /* ==========================================
       NUEVA PARTIDA
       ========================================== */

    document
    .getElementById("newGameBtn")
    .addEventListener("click",()=>{

        // Reiniciar pregunta actual
        localStorage.setItem(
            "currentQuestion",
            0
        );

        // Reiniciar puntuación
        localStorage.setItem(
            "score",
            0
        );

        // Ir a la primera pregunta
        window.location.href =
        "question.html";

    });


    /* ==========================================
       CONTINUAR PARTIDA
       ========================================== */

    document
    .getElementById("continueGameBtn")
    .addEventListener("click",()=>{

        // Seguir exactamente donde estaba
        window.location.href =
        "question.html";

    });

    </script>

</body>

</html>
