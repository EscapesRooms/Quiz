<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Codificación de caracteres -->
    <meta charset="UTF-8">

    <!-- Adaptación a móviles -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Normas del Juego</title>

    <!-- Cargar hoja de estilos -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="welcome-container">

        <!-- Título principal -->
        <h1 class="game-title">
            📋 NORMAS DEL JUEGO
        </h1>

        <!-- Aquí mostraremos el nombre del jugador y el equipo -->
        <div id="playerInfo"></div>

        <!-- Caja de normas -->
        <div class="rules-box">

            <p>⏱ Cada pregunta tendrá 15 segundos.</p>

            <p>✅ Cada acierto suma 1 punto.</p>

            <p>❌ No podrás cambiar tu respuesta.</p>

            <p>📊 Se mostrará la respuesta correcta al finalizar.</p>

            <p>🏆 Consigue la máxima puntuación posible.</p>

        </div>

        <!-- Aquí mostraremos información de una partida guardada -->
        <div id="saveInfo"></div>

        <!-- Botón para empezar desde cero -->
        <button id="newGameBtn"
                class="continue-btn">

            🎮 Nueva partida

        </button>

        <!-- Botón para continuar una partida existente -->
        <button id="continueGameBtn"
                class="continue-btn"
                style="display:none;">

            ↩️ Continuar partida

        </button>

    </div>
<script src="js/rules.js"></script>
</body>

</html>
