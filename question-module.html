<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="question-container">

        <div class="timer" id="timer">
            15
        </div>
        <div id="questionCounter"></div>
        
        <div id="playerScore"></div>

        <div class="category" id="category"></div>

        <h1 class="question-title" id="question">
        </h1>

        <div class="answers">

            <button class="answer" id="a0"></button>

            <button class="answer" id="a1"></button>

            <button class="answer" id="a2"></button>

            <button class="answer" id="a3"></button>

        </div>

        <div id="answerStatus"></div>
        <div id="resultBox" style="display:none;"></div>

    </div>

    <script type="module" src="js/questions-module.js"></script>
    <script type="module" src="js/question-module.js"></script>

</body>

</html>
