<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="question-container">

        <div class="timer" id="timer">
            15
        </div>

        <div class="category" id="category">
        </div>

        <h1 class="question-title" id="question">
        </h1>

        <div class="answers">

            <button class="answer red" id="a0"></button>

            <button class="answer yellow" id="a1"></button>

            <button class="answer green" id="a2"></button>

            <button class="answer blue" id="a3"></button>

        </div>

        <div id="answerStatus"></div>

    </div>

    <script src="js/questions.js"></script>

    <script>

        let currentQuestion =
            parseInt(localStorage.getItem("currentQuestion")) || 0;

        if (currentQuestion >= questions.length) {
            currentQuestion = 0;
            localStorage.setItem("currentQuestion", 0);
        }

        const q = questions[currentQuestion];

        document.getElementById("category").textContent =
            q.category;

        document.getElementById("question").textContent =
            q.question;

        for (let i = 0; i < 4; i++) {

            document.getElementById("a" + i).textContent =
                q.answers[i];

        }

        let answered = false;

        const buttons =
            document.querySelectorAll(".answer");

        buttons.forEach((button, index) => {

            button.addEventListener("click", () => {

                if (answered) return;

                answered = true;

                button.classList.add("selected");

                buttons.forEach(btn => {

                    btn.disabled = true;

                    if (btn !== button) {
                        btn.style.opacity = "0.4";
                    }

                });

                document.getElementById("answerStatus").innerHTML =
                    "✅ Respuesta enviada";

            });

        });

        let time = 15;

        const timer =
            document.getElementById("timer");

        timer.textContent = time;

        const interval = setInterval(() => {

            time--;

            if (time <= 0) {

                timer.textContent = "0";

                clearInterval(interval);

                setTimeout(() => {

                    currentQuestion++;

                    localStorage.setItem(
                        "currentQuestion",
                        currentQuestion
                    );

                    if (currentQuestion < questions.length) {

                        location.reload();

                    } else {

                        alert("🎉 Juego finalizado");

                        localStorage.setItem(
                            "currentQuestion",
                            0
                        );

                    }

                }, 2000);

                return;
            }

            timer.textContent = time;

        }, 1000);

    </script>

</body>

</html>
