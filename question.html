<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="question-container">

    <div class="timer" id="timer">
        15
    </div>

    <div class="category" id="category"></div>

    <h1 class="question-title" id="question"></h1>

    <div class="answers">

    <button class="answer red" id="a0"></button>

    <button class="answer yellow" id="a1"></button>

    <button class="answer green" id="a2"></button>

    <button class="answer blue" id="a3"></button>

    </div>

    <div id="answerStatus"></div>

</div>

<script>

let time = 15;
let answered = false;

const timer = document.getElementById("timer");

const interval = setInterval(() => {

    if (time <= 0) {
        timer.textContent = "0";
        clearInterval(interval);
        return;
    }

    time--;
    timer.textContent = time;

}, 1000);

document.querySelectorAll(".answer").forEach(button=>{

    button.addEventListener("click",()=>{

        if(answered) return;

        answered = true;

        button.classList.add("selected");

        document.getElementById("answerStatus").innerHTML =
        "✅ Respuesta enviada";

    });

});


<script>

let currentQuestion =
parseInt(localStorage.getItem("currentQuestion")) || 0;

let answered = false;

const q = questions[currentQuestion];

document.getElementById("category").textContent =
q.category;

document.getElementById("question").textContent =
q.question;

for(let i=0;i<4;i++){

document.getElementById("a"+i).textContent =
q.answers[i];

}

document.querySelectorAll(".answer")
.forEach((button,index)=>{

button.addEventListener("click",()=>{

if(answered) return;

answered = true;

button.classList.add("selected");

document
.getElementById("answerStatus")
.innerHTML =
"✅ Respuesta enviada";

});

});


let time = 15;

const timer =
document.getElementById("timer");

const interval =
setInterval(()=>{

if(time <= 0){

clearInterval(interval);

setTimeout(()=>{

currentQuestion++;

localStorage.setItem(
"currentQuestion",
currentQuestion
);

if(currentQuestion < questions.length){

window.location.reload();

}else{

alert("Juego finalizado");

}

},2000);

return;

}

timer.textContent = time;

time--;

},1000);

</script>

</body>

</html>
