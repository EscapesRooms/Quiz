<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Battle</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="welcome-container">

        <h1 class="game-title">
            El gran Quiz de la Júlia
        </h1>
        <div id="savedPlayerInfo"></div>
        <!-- Opciones para jugador ya configurado -->
        <div id="existingPlayerActions"
             style="display:none;">
        
            <button id="continueExistingPlayer"
                    class="continue-btn">
        
                ▶ Continuar amb aquest jugador
        
            </button>
        
            <button id="resetPlayerBtn"
                    class="continue-btn">
        
                🔄 Canviar jugador
        
            </button>
        
        </div>

        <p class="description">
            Escriu el teu nom per començar el quiz i guardar la teva puntuació.
        </p>

        <input
            type="text"
            id="playerName"
            placeholder="Introduce tu nombre"
            class="player-input"
        />

        <button id="continueBtn" class="continue-btn" disabled>
            Començar quiz
        </button>
        <button class="continue-btn" onclick="localStorage.clear();location.reload();">
            Borrar dades
        </button>

    </div>

    <script type="module" src="js/game-module-real.js"></script>

</body>

</html>
